version: '3.9'

volumes:
  db:

services:
  pg_db:
    image: postgres:16.2
    container_name: OAUTH2DB
    restart: always
    environment:
      - POSTGRES_DB=DBforOAuth2
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=12345
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data